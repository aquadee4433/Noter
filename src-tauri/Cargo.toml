[package]
name = "noter"
version = "0.1.0"
description = "Cross-platform bilingual speech-to-text desktop plugin"
authors = ["aquadee"]
license = "MIT"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-clipboard-manager = "2"
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
whisper-rs = "0.12"
cpal = "0.15"
tokio = { version = "1", features = ["full"] }
dirs = "5"
log = "0.4"
env_logger = "0.10"
reqwest = { version = "0.12", features = ["blocking"] }
sha2 = "0.10"

[features]
default = []
