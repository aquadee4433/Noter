[package]
name = "whisper-core"
version = "0.1.0"
edition = "2021"
description = "Shared Rust inference library for whisper.cpp-based speech-to-text"
license = "MIT"

[dependencies]
whisper-rs = "0.12"
cpal = "0.15"
tokio = { version = "1", features = ["full"] }
dirs = "5"
log = "0.4"
reqwest = { version = "0.12", features = ["blocking"] }
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
